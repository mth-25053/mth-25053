<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06140f"/>
      <stop offset="1" stop-color="#0b1f2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#dots)"/>
  <rect x="0" y="312" width="1200" height="8" fill="url(#accent)"/>

  <!-- terminal window -->
  <g transform="translate(660 54)">
    <rect width="480" height="212" rx="14" fill="#0f1720" stroke="#1f2d3a"/>
    <circle cx="24" cy="24" r="6" fill="#ef4444"/>
    <circle cx="44" cy="24" r="6" fill="#facc15"/>
    <circle cx="64" cy="24" r="6" fill="#22c55e"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
      <text x="24" y="72" fill="#64748b">$ whoami</text>
      <text x="24" y="100" fill="#e2e8f0">full-stack developer · Nouakchott</text>
      <text x="24" y="136" fill="#64748b">$ cat stack.txt</text>
      <text x="24" y="164" fill="#22c55e">Next.js · TypeScript · PostgreSQL</text>
      <text x="24" y="192" fill="#facc15">Prisma · Supabase · Tailwind</text>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="120" font-size="64" font-weight="800" fill="#f8fafc">Mouthena Baba</text>
    <text x="62" y="166" font-size="22" fill="#94a3b8" letter-spacing="3">FULL-STACK DEVELOPER · MAURI-DEV</text>
    <text x="62" y="236" font-size="20" fill="#cbd5e1">Web apps for Mauritania — in Arabic, French &amp; English</text>
  </g>
</svg>
